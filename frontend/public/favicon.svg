<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#035e53"/>
      <stop offset="40%" stop-color="#013e37"/>
      <stop offset="100%" stop-color="#002420"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="35%" stop-color="#f5de93"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5de93" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Base -->
  <path d="M32 4 C46 4 56 12 56 22 C56 41 43 53 32 60 C21 53 8 41 8 22 C8 12 18 4 32 4 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Shield Trim Rim -->
  <path d="M32 9 C43 9 51 15 51 23 C51 38 40 48 32 54 C24 48 13 38 13 23 C13 15 21 9 32 9 Z" 
        fill="none" stroke="url(#trimGrad)" stroke-width="1" stroke-dasharray="2 1.5"/>

  <!-- Integrity Diamond Nuqta (Traditional Scholarly Dot) -->
  <polygon points="32,8 34.5,11 32,14 29.5,11" fill="url(#goldGrad)" />

  <!-- Academic Quill Nib -->
  <path d="M32 17 L39 29 C38 33 35 34.5 32 35 C29 34.5 26 33 25 29 Z" 
        fill="url(#goldGrad)"/>
  <!-- Quill Center Slit & Ink Breather Hole -->
  <line x1="32" y1="20" x2="32" y2="28" stroke="#013e37" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="32" cy="28.5" r="1.2" fill="#013e37"/>

  <!-- Golden Verification Checkmark -->
  <path d="M21 37.5 L29 45.5 L44 28" 
        stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)"/>
</svg>
